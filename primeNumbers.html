<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Generate Prime Numbers</h2>

    Enter Number 1:
    <input type="number" id="num1">
    <br><br>

    Enter Number 2:
    <input type="number" id="num2">
    <br><br>

    <button onclick="generatePrimes()">Submit</button>

    <p id="result"></p>

    <script>
        function generatePrimes() {
            let start = parseInt(document.getElementById("num1").value);
            let end = parseInt(document.getElementById("num2").value);
            let output = "";

            for (let n = start; n <= end; n++) {
                if (n < 2) {
                    continue;
                }

                let prime = true;

                for (let i = 2; i < n; i++) {
                    if (n % i == 0) {
                        prime = false;
                        break;
                    }
                }

                if (prime) {
                        output += n + " ";
                    }
            }

            document.getElementById("result").innerHTML = "Prime Numbers: " + output;
        }
    </script>
</body>
</html>
